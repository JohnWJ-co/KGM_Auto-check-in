name: 自动同步上游仓库(同步+保活)
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

env:
  UPSTREAM_REPO: kirtocloud-cloud/KGM_Auto-check-in
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置Git用户信息
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: 绑定上游源仓库
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream

      - name: 合并上游最新代码
        run: |
          git checkout ${{ env.TARGET_BRANCH }}
          git merge upstream/${{ env.TARGET_BRANCH }} -m "Auto sync upstream $(date '+%Y-%m-%d')"

      - name: 仅存在更新时推送
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git push origin ${{ env.TARGET_BRANCH }}
          else
            echo "本地与上游无差异，无需推送，本次同步完成保活"
          fi
